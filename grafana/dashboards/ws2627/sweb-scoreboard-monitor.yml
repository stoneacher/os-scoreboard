                          |> group(columns: ["display_name"])
                          |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: true)
                          |> map(fn: (r) => ({_time: r._time, _value: r._value, _field: r.display_name}))
                          |> group(columns: ["_field"])
                          |> yield(name: "comparison")
                    version: v0
                  refId: A
            queryOptions:
