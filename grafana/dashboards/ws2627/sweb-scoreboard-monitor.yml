apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  name: test-sweb-scoreboard-monitor-new
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        builtIn: true
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        query:
          datasource:
            name: '-- Grafana --'
          group: grafana
          kind: DataQuery
          spec:
            limit: 100
            matchAny: false
            tags: []
            type: dashboard
          version: v0
    - kind: AnnotationQuery
      spec:
        enable: true
        hide: false
        iconColor: red
        mappings:
          tags:
            source: field
            value: tags
          text:
            source: field
            value: text
          time:
            source: field
            value: _time
          timeEnd:
            source: field
            value: _end
        name: Scrape failures (auto)
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |-
              from(bucket: "${bucket}")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "scraper_health" and r._field == "ok")
                  |> group()
                  |> sort(columns: ["_time"])
                  |> map(fn: (r) => ({_time: r._time, failed: if r._value then 0 else 1, run: if r._value then 0 else 1}))
                  |> difference(columns: ["run"], keepFirst: true)
                  |> map(fn: (r) => ({r with run: if exists r.run and r.run == 0 then 0 else 1}))
                  |> cumulativeSum(columns: ["run"])
                  |> filter(fn: (r) => r.failed == 1)
                  |> group(columns: ["run"])
                  |> reduce(
                      identity: {_time: 2200-01-01T00:00:00Z, _end: 1970-01-01T00:00:00Z, n: 0},
                      fn: (r, accumulator) => ({
                          _time: if r._time < accumulator._time then r._time else accumulator._time,
                          _end: if r._time > accumulator._end then r._time else accumulator._end,
                          n: accumulator.n + 1,
                      }),
                  )
                  |> group()
                  |> map(fn: (r) => ({
                      _time: r._time,
                      _end: r._end,
                      text: "Scrape failing: " + string(v: r.n) + " consecutive failed scrape(s)",
                      tags: "outage,auto",
                  }))
            refId: Anno
          version: v0
    - kind: AnnotationQuery
      spec:
        enable: true
        hide: false
        iconColor: blue
        mappings:
          tags:
            source: field
            value: tags {_start="2026-10-30 13:51:30.118 +0000 UTC", _stop="2027-01-22 19:51:30.118 +0000 UTC"}
          text:
            source: field
            value: text {_start="2026-10-30 13:51:30.118 +0000 UTC", _stop="2027-01-22 19:51:30.118 +0000 UTC"}
        name: Deadlines
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |-
              import "array"

              array.from(rows: [
                {
                  _time: 2026-10-30T18:00:00+01:00,
                  text: "Deadline POC-A1",
                  tags: "deadline,POC-A1"
                },
                {
                  _time: 2026-11-20T18:00:00+01:00,
                  text: "Deadline A1",
                  tags: "deadline,A1"
                },
                {
                  _time: 2026-12-18T18:00:00+01:00,
                  text: "Deadline POC-A2",
                  tags: "deadline,POC-A2"
                },
                {
                  _time: 2027-01-22T18:00:00+01:00,
                  text: "Deadline A2",
                  tags: "deadline,A2"
                }
              ])
                |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
            refId: Anno
          version: v0
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        from(bucket: "${bucket}")
                          |> range(start: -7d)
                          |> filter(fn: (r) => r._measurement == "scraper_health" and r._field == "rows_parsed")
                          |> group()
                          |> last()
                          |> map(fn: (r) => ({_time: now(), _value: float(v: uint(v: now()) - uint(v: r._time)) / 1000000000.0, _field: "last_scrape_age_seconds"}))
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: scrapes for changes every 60 seconds. Global update (regardless of changes) every 30m.
        id: 1
        links: []
        title: Last Scrape Age
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: yellow
                      value: 50
                    - color: red
                      value: 60
                unit: s
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
          version: 13.3.0
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        from(bucket: "${bucket}")
                          |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                          |> filter(fn: (r) => r._measurement == "team_scoreboard" and r._field == "queue_running_percent")
                          |> filter(fn: (r) => exists r.team_id and r.team_id =~ /^${team_id:regex}$/)
                          |> group(columns: ["display_name"])
                          |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)
                          |> map(fn: (r) => ({r with _field: r.display_name}))
                          |> keep(columns: ["_time", "_value", "_field"])
                          |> group(columns: ["_field"])
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 10
        links: []
        title: Testsystem running progress
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 10
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: 360000
                  lineInterpolation: stepAfter
                  lineWidth: 2
                  pointSize: 3
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                unit: percent
              overrides: []
            options:
              legend:
                calcs:
                  - count
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
          version: 13.3.0
    panel-11:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        names = from(bucket: "${bucket}")
                          |> range(start: 0)
                          |> filter(fn: (r) => r._measurement == "team_scoreboard" and r._field == "rank")
                          |> filter(fn: (r) => exists r.team_id and r.team_id =~ /^${team_id:regex}$/)
                          |> filter(fn: (r) => not exists r.submission_type or r.submission_type =~ /^${submission_type:regex}$/)
                          |> keep(columns: ["_time", "team_id", "display_name"])
                          |> group(columns: ["team_id", "display_name"])
                          |> reduce(
                            identity: {first_seen: now(), last_seen: time(v: 0)},
                            fn: (r, accumulator) => ({
                              first_seen: if r._time < accumulator.first_seen then r._time else accumulator.first_seen,
                              last_seen: if r._time > accumulator.last_seen then r._time else accumulator.last_seen
                            })
                          )
                          |> group(columns: ["team_id"])

                        nameStatus = names
                          |> reduce(
                            identity: {has_name: false},
                            fn: (r, accumulator) => ({has_name: accumulator.has_name or r.display_name != r.team_id})
                          )

                        join(tables: {names: names, status: nameStatus}, on: ["team_id"])
                          |> filter(fn: (r) => r.display_name != r.team_id or not r.has_name)
                          |> drop(columns: ["has_name"])
                          |> group(columns: ["team_id"])
                          |> sort(columns: ["first_seen", "display_name"])
                          |> reduce(
                            identity: {name_count: 0, names: ""},
                            fn: (r, accumulator) => ({
                              name_count: accumulator.name_count + (if r.display_name == r.team_id then 0 else 1),
                              names: accumulator.names + (if accumulator.names == "" then "" else " • ") + r.display_name
                            })
                          )
                          |> group()
                          |> sort(columns: ["name_count", "team_id"], desc: true)
                    version: v0
                  refId: A
            queryOptions: {}
            transformations:
              - group: organize
                kind: Transformation
                spec:
                  options:
                    excludeByName: {}
                    indexByName:
                      name_count: 1
                      names: 2
                      team_id: 0
                    renameByName:
                      name_count: Distinct names
                      names: Names (first observed order)
                      team_id: Team ID
        description: Distinct scoreboard display names per stable team ID across all retained data in the selected semester bucket, independent of the dashboard time range. Respects the teamID and submission_type filters. An ID-only label is shown only when no other name is observed for that team within these filters, and contributes zero to the distinct name count. Reusing a previous name does not increase the count; the name list is ordered by first observation, not a sequence of every rename.
