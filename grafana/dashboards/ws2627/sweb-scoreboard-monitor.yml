  links: []
  liveNow: false
  preload: false
  tags:
    - scoreboard
    - influxdb
  timeSettings:
    autoRefresh: 5m
    autoRefreshIntervals:
      - 5s
      - 10s
      - 30s
      - 1m
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 1d
    fiscalYearStartMonth: 0
    from: now-6h
    hideTimepicker: false
    timezone: browser
    to: now
  title: Sweb Scoreboard Monitor
  variables:
    - kind: QueryVariable
      spec:
        allowCustomValue: true
        current:
          text: scoreboard-ws2026
          value: scoreboard-ws2026
        definition: |-
          import "strings"

          buckets()
            |> filter(fn: (r) => r.name =~ /^scoreboard-(ss|ws)[0-9]{4}$/)
            |> map(fn: (r) => ({_value: r.name, semester: strings.substring(v: r.name, start: 13, end: 17) + (if strings.hasPrefix(v: r.name, prefix: "scoreboard-ws") then "1" else "0")}))
            |> sort(columns: ["semester"], desc: true)
            |> keep(columns: ["_value"])
        description: One bucket per semester (scoreboard-ssYYYY / scoreboard-wsYYYY). For past semesters, set the time range to that semester.
        hide: dontHide
        includeAll: false
        label: Semester
        multi: false
        name: bucket
        options: []
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |-
              import "strings"

              buckets()
                |> filter(fn: (r) => r.name =~ /^scoreboard-(ss|ws)[0-9]{4}$/)
                |> map(fn: (r) => ({_value: r.name, semester: strings.substring(v: r.name, start: 13, end: 17) + (if strings.hasPrefix(v: r.name, prefix: "scoreboard-ws") then "1" else "0")}))
                |> sort(columns: ["semester"], desc: true)
                |> keep(columns: ["_value"])
          version: v0
        refresh: onDashboardLoad
        regex: ''
        regexApplyTo: value
        skipUrlSync: false
        sort: disabled
    - kind: QueryVariable
      spec:
        allowCustomValue: false
        current:
          text: All
          value: $__all
        definition: |-
          import "influxdata/influxdb/schema"
          schema.tagValues(bucket: "${bucket}", tag: "team_id", predicate: (r) => r._measurement == "team_scoreboard", start: time(v: 0))
        description: The team Identiefier on the testsystem
        hide: dontHide
        includeAll: true
        label: teamID
        multi: true
        name: team_id
        options: []
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |-
              import "influxdata/influxdb/schema"
              schema.tagValues(bucket: "${bucket}", tag: "team_id", predicate: (r) => r._measurement == "team_scoreboard", start: time(v: 0))
          version: v0
        refresh: onTimeRangeChanged
        regex: ''
        regexApplyTo: value
        skipUrlSync: false
        sort: alphabeticalAsc
    - kind: QueryVariable
      spec:
        allowCustomValue: false
        current:
          text: All
          value: $__all
        definition: |2-
            import "influxdata/influxdb/schema"
            schema.tagValues(bucket: "${bucket}", tag: "submission_type", predicate: (r) => r._measurement == "team_scoreboard", start: time(v: 0))
        description: |-
          SubmissionD1 -> Design-PoC A1 ///// 
          SubmissionI1 -> Implementation A1 ///// 
          SubmissionD2 -> Design-PoC A2 ///// 
          SubmissionI2 -> Implementation A2 ///// 
          SubmissionS1 -> Second Chance A1 ///// 
          SubmissionS2 -> Second Chance A2
        hide: dontHide
        includeAll: true
        label: SubmissionID
        multi: true
        name: submission_type
        options: []
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |2-
                import "influxdata/influxdb/schema"
                schema.tagValues(bucket: "${bucket}", tag: "submission_type", predicate: (r) => r._measurement == "team_scoreboard", start: time(v: 0))
          version: v0
        refresh: onTimeRangeChanged
        regex: ''
        regexApplyTo: value
        skipUrlSync: false
        sort: disabled
