                            fn: (r, accumulator) => ({has_name: accumulator.has_name or r.display_name != r.team_id})
                          )

                        join(tables: {names: names, status: nameStatus}, on: ["team_id"])
                          |> filter(fn: (r) => r.display_name != r.team_id or not r.has_name)
                          |> drop(columns: ["has_name"])
                          |> group()
                          |> sort(columns: ["team_id", "first_seen", "display_name"])
                    version: v0
                  refId: A
            queryOptions: {}
            transformations:
              - group: organize
                kind: Transformation
                spec:
                  options:
                    excludeByName: {}
                    indexByName:
                      display_name: 1
                      first_seen: 2
                      last_seen: 3
                      team_id: 0
                    renameByName:
                      display_name: Observed name
                      first_seen: First observed
                      last_seen: Last observed
                      team_id: Team ID
        description: One row per stable team ID and distinct scoreboard display name across all retained data in the selected semester bucket, independent of the dashboard time range. Respects the teamID and submission_type filters. First/last observed are scrape timestamps, not exact rename times. Repeated uses of the same name share one row and may include gaps. Anonymous teams without a stable ID are excluded. An ID-only label is included only when no other name is observed for that team within these filters.
