    panel-9:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        from(bucket: "${bucket}")
                          |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                          |> filter(fn: (r) => r._measurement == "team_scoreboard")
                          |> filter(fn: (r) => exists r.team_id)
                          |> filter(fn: (r) => r._field == "rank" or r._field == "score" or r._field == "queue_raw" or r._field == "queue_state" or r._field == "queue_running_percent" or r._field == "queue_position" or r._field == "queue_wait_minutes")
