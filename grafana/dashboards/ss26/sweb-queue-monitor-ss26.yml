                          |> last()
                          |> pivot(rowKey: ["team_id", "display_name"], columnKey: ["_field"], valueColumn: "_value")
                          |> group()
                          |> filter(fn: (r) => exists r.queue_state)
                          |> keep(columns: ["team_id", "display_name", "rank", "score", "queue_state", "queue_raw", "queue_running_percent", "queue_position", "queue_wait_minutes"])
                          |> sort(columns: ["rank"])
