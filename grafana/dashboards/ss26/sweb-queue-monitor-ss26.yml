                          |> filter(fn: (r) => r._measurement == "team_scoreboard")
                          |> filter(fn: (r) => exists r.team_id and r.team_id =~ /^${team_id:regex}$/)
                          |> filter(fn: (r) => r._field == "queue_position" or r._field == "queue_wait_minutes")
                          |> group(columns: ["display_name", "_field"])
                          |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)
                          |> map(fn: (r) => ({r with _field: if r._field == "queue_position" then r.display_name + " position" else r.display_name + " wait"}))
