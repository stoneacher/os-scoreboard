                    id: byRegexp
                    options: ^.*\bposition\b$
                  properties:
                    - id: unit
                    - id: custom.axisLabel
                      value: Postition
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
