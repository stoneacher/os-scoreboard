apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  name: sweb-queue-monitor
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        builtIn: true
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        query:
          datasource:
            name: '-- Grafana --'
          group: grafana
          kind: DataQuery
          spec: {}
          version: v0
    - kind: AnnotationQuery
      spec:
        enable: false
        hide: false
        iconColor: orange
        mappings:
          tags:
            source: field
            value: tags
          text:
            source: field
            value: text
          time:
            source: field
            value: _time
          timeEnd:
            source: field
            value: _end
          title:
            source: field
            value: title
        name: Parsing Issue Info
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |2
                import "array"

                array.from(rows: [{
                  _time: 2026-04-24T15:10:00Z,
                  _end:  2026-04-28T13:10:00Z,
                  text:  "Testsystem stopped showing some TeamIDs in parentheses, so the regex no longer matched and InfluxDB could not assign scraped data to the correct TeamID.",
                  tags:  "parser,bug"
                }])
            refId: Anno
          version: v0
    - kind: AnnotationQuery
      spec:
        enable: true
        hide: true
        iconColor: green
        mappings:
          tags:
            source: field
            value: tags
          text:
            source: field
            value: text
          time:
            source: field
            value: _time
          timeEnd:
            source: field
            value: _end
        name: Deadline A1
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |2-
                import "array"

                array.from(rows: [{
                  _time: 2026-04-24T10:00:00Z,
                  _end:  2026-04-24T16:00:00Z,
                  text:  "Submission Deadline A1",
                  tags:  "deadline"
                }])
            refId: Anno
          version: v0
    - kind: AnnotationQuery
      spec:
        enable: true
        hide: true
        iconColor: green
        mappings:
          tags:
            source: field
            value: tags
          text:
            source: field
            value: text
          time:
            source: field
            value: _time
          timeEnd:
            source: field
            value: _end
        name: Testsystem A2 Design Discussion
        query:
          datasource:
            name: influxdb
          group: influxdb
          kind: DataQuery
          spec:
            query: |2-
                import "array"

                array.from(rows: [{
                  _time: 2026-05-11T09:30:00Z,
                  _end:  2026-05-11T10:30:00Z,
                  text:  "Testystem switch to A2 Design Discussion",
                  tags:  "tags"
                }])
            refId: Anno
          version: v0
  cursorSync: Crosshair
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        from(bucket: "${bucket}")
                          |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                          |> filter(fn: (r) => r._measurement == "scoreboard_queue" and r._field == "running_count")
                          |> group()
                          |> last()
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 1
        links: []
        title: Running Tests
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                noValue: no tests running
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: yellow
                      value: 3
                    - color: red
                      value: 5
                unit: none
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.3.0
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        from(bucket: "${bucket}")
                          |> range(start: -7d)
                          |> filter(fn: (r) => r._measurement == "scraper_health" and r._field == "rows_parsed")
                          |> group()
                          |> last()
                          |> map(fn: (r) => ({_time: now(), _value: float(v: uint(v: now()) - uint(v: r._time)) / 1000000000.0, _field: "last_scrape_age_seconds"}))
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: scrapes for changes every 60 seconds. Global update (regardless of changes) every hour.
        id: 10
        links: []
        title: Last Scrape Age
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: yellow
                      value: 600
                    - color: red
                      value: 1200
                unit: s
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
          version: 13.3.0
    panel-11:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: influxdb
                    group: influxdb
                    kind: DataQuery
                    spec:
                      query: |-
                        from(bucket: "${bucket}")
                          |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                          |> filter(fn: (r) => r._measurement == "scoreboard_queue")
                          |> filter(fn: (r) => r._field == "running_count" or r._field == "queued_count")
                          |> group(columns: ["_field"])
                          |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: true)
                          |> fill(usePrevious: true)
                          |> map(fn: (r) => ({r with _field: if r._field == "running_count" then "Running tests" else "Queued teams"}))
                          |> keep(columns: ["_time", "_value", "_field"])
                          |> group(columns: ["_field"])
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: Queue and running test stacked version
        id: 11
        links: []
        title: Queue Activity Over Time
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 12
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 3
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: normal
                  thresholdsStyle:
                    mode: 'off'
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                unit: none
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
          version: 13.3.0
